const TOTAL=7200,PASS=8;
const READ=`<p>El colegio es un espacio <b>público</b>: pertenece a toda la comunidad educativa, incluidos quienes llegarán después de nosotros. Cada pupitre, baño, cancha, biblioteca o árbol existe porque alguien lo pagó, lo construyó o lo sembró pensando en el bien común.</p><p>Cuidar lo público no es solo "no dañar": es <b>usar con responsabilidad</b>, <b>reportar</b> a tiempo los daños, <b>colaborar</b> en el aseo, <b>respetar</b> los turnos y los espacios de los demás y <b>enseñar con el ejemplo</b>. Un vidrio roto o un grifo abierto parecen detalles, pero su costo lo asumimos todos y se traduce en menos recursos para actividades, materiales y mejoras.</p><p>Tres ideas clave: 1) <b>Pertenencia:</b> lo que es de todos es también mío. 2) <b>Corresponsabilidad:</b> docentes, estudiantes y directivos cuidamos juntos. 3) <b>Prevención:</b> es más barato y justo cuidar que reparar.</p><p>Cuando una comunidad cuida lo que comparte, mejora la convivencia, se reduce la indisciplina y aprender se vuelve más agradable. Ser ciudadano comienza en el colegio.</p>`;
const M=[
{t:"Sentido de pertenencia y bienes públicos",v:"cuidado de los bienes públicos educación niños",g:["Lo público pertenece a toda la comunidad.","Los bienes se pagan con recursos de todos.","Cuidar es responsabilidad compartida."],
q:["Un bien público es aquel que|Pertenece y sirve a toda la comunidad|Es solo del rector|Es de quien lo usa primero","El mobiliario del colegio es|De toda la comunidad educativa|Propiedad de cada estudiante|Del docente de turno","Quien paga el daño de un bien público es|Toda la comunidad|Nadie|Solo el vigilante","El sentido de pertenencia significa|Sentir como propio lo que es de todos|Llevarse cosas a casa|Ignorar las normas","Cuidar lo público beneficia a|Estudiantes presentes y futuros|Solo a los docentes|Solo a los directivos","Si veo un daño en el colegio debo|Reportarlo a un docente o directivo|Ignorarlo|Culpar a otro","Rayar un pupitre es|Un daño al bien común|Una forma de arte permitida|Algo sin importancia","La corresponsabilidad implica que|Todos cuidamos juntos|Solo cuida el personal de aseo|Solo cuidan los profesores","Un buen ejemplo de cuidado es|Dejar el salón ordenado|Dañar y callar|Esconder el desperfecto","Lo público se cuida porque|Es de todos y debe durar|Nadie lo revisa|Es fácil reponerlo"]},
{t:"Aulas, mobiliario y equipos",v:"cuidado de aulas pupitres equipos escolares",g:["Usar cada elemento para lo que fue diseñado.","Apagar luces y equipos al salir.","Reportar fallas de inmediato."],
q:["Los pupitres se deben usar para|Sentarse y trabajar|Pararse sobre ellos|Columpiarse","Al terminar la jornada en el aula se debe|Apagar luces y ventiladores|Dejarlos encendidos|Cerrar sin revisar","Si un proyector falla, lo correcto es|Avisar al responsable|Golpearlo|Desarmarlo","Las paredes del salón|No se rayan ni se pegan objetos sin permiso|Sirven para escribir|Se pintan libremente","Los computadores del colegio se usan para|Fines académicos|Instalar juegos|Visitar cualquier sitio","Una silla rota debe|Reportarse para su reparación|Esconderse|Usarse igual","Los tableros se limpian|Al terminar la clase|Nunca|Con cualquier líquido","Antes de salir del salón conviene|Recoger papeles y ordenar|Dejar todo en el piso|Mover los muebles","Los libros de la biblioteca|Se devuelven en buen estado|Se subrayan|Se prestan sin registro","Cuidar los equipos prolonga|Su vida útil|Su costo|Su desgaste"]},

const $=s=>document.getElementById(s);let S=JSON.parse(localStorage.getItem("cp")||"null");
function save(){try{localStorage.setItem("cp",JSON.stringify(S))}catch(e){}}
function shuf(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function left(){return Math.max(0,TOTAL-Math.floor((Date.now()-S.start)/1000))}
function fmt(s){return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,"0")).join(":")}
setInterval(()=>{if(!S)return;const l=left();$("hd").textContent=`${S.name} · ⏱ ${fmt(l)}`;if(l==0&&!S.done&&!S.exp){S.exp=1;save();home()}},1000);
function reg(){$("hd").textContent="";$("app").innerHTML=`<div class="card"><h2>Bienvenido al curso</h2><p class="m">5 módulos · 10 preguntas por módulo · Aprueba con 80% para avanzar · Certificado en PDF al finalizar.</p>
<label>Nombre completo</label><input id="n"><label>Documento de identidad</label><input id="d" inputmode="numeric"><label>Sección / Grado</label><input id="s" placeholder="Ej: 9-B">
<label>Rol</label><select id="r"><option value="">Seleccione…</option><option>Estudiante</option><option>Docente</option></select>
<button onclick="go()">Iniciar curso</button></div>${shieldBox()}`}
function go(){const n=$("n").value.trim(),d=$("d").value.trim(),s=$("s").value.trim(),r=$("r").value;
const e=[];
if(!n)e.push("Falta el nombre completo.");else if(!/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' ]{5,}$/.test(n)||n.split(/\s+/).length<2)e.push("El nombre debe incluir nombre y apellido, solo con letras (sin números ni símbolos).");
if(!d)e.push("Falta el número de documento.");else if(!/^\d{5,12}$/.test(d))e.push("El documento debe tener solo números (5 a 12 dígitos), sin puntos ni espacios.");
if(!r)e.push("Seleccione si es Estudiante o Docente.");
if(!s)e.push("Falta la sección.");else if(r=="Estudiante"&&!/^\d{1,2}\s?[-°]?\s?[A-Za-z0-9]{1,3}$/.test(s))e.push("La sección no corresponde al formato esperado para estudiantes (ejemplos: 9-B, 10-2 o 1101).");
if(e.length){note(e.join("<br>"));return}
S={name:n,doc:d,sec:s,role:r,start:Date.now(),sc:[],rd:[],vd:[]};save();home()}
function home(){const ok=S.sc.filter(x=>x>=PASS).length,pct=ok*20,all=ok==5&&1;
let h=`<div class="card"><h2>Hola, ${S.name.split(" ")[0]}</h2><p class="m">${S.role} · Sección ${S.sec} · Doc. ${S.doc}</p><div class="bar"><i style="width:${pct}%"></i></div><p class="m">Progreso: ${pct}% · Tu avance se guarda automáticamente.</p>
<p class="m">Cada módulo incluye una lectura y un video (obligatorios antes de enviar su cuestionario).</p></div>`;
if(S.exp)h+=`<div class="card"><b>⏱ El tiempo de 2 horas terminó.</b><br><button onclick="S.start=Date.now();S.exp=0;save();home()">Reiniciar el tiempo (conserva tu progreso)</button></div>`;
M.forEach((m,i)=>{const lock=(i>0&&!(S.sc[i-1]>=PASS))||S.exp;
h+=`<div class="card mod"><div><b>Módulo ${i+1}: ${m.t}</b><br><span class="m">${S.sc[i]!=null?"Mejor nota: "+S.sc[i]*10+"%":"Pendiente"}</span></div><div>${S.sc[i]>=PASS?'<span class="tag ok">Aprobado</span>':''}<button class="${lock?'s':''}" onclick="mod(${i})">${lock?" Bloqueado":"Abrir"}</button></div></div>`});
h+=`<div class="card"><h2> Certificado</h2><p class="m">Disponible al aprobar los 5 módulos y leer la lectura.</p><button onclick="cert()">Descargar certificado PDF</button></div>`;
$("app").innerHTML=(S.printed?`<div class="card" style="border-color:var(--p)"><h2>Certificado generado</h2><p class="m">Verifique que su PDF se guardó. Al empezar un nuevo curso se borrará el progreso y los datos actuales.</p><button onclick="newCourse()">Volver a la página principal y empezar un nuevo curso</button></div>`:"")+h+shieldBox()}
let cur=null,Q=[];
function mod(i){if(S.exp){note("El tiempo de 2 horas terminó. Reinicie el tiempo para continuar; su progreso se conserva.");return}
if(i>0&&!(S.sc[i-1]>=PASS)){note(`Aún no puede abrir el Módulo ${i+1}: debe aprobar el Módulo ${i} con al menos 80% (8 de 10).`);return}
cur=i;const m=M[i];Q=shuf(m.q.map(x=>x.split("|"))).map(a=>({q:a[0],o:shuf(a.slice(1)),c:a[1]}));
let h=`<button class="s" onclick="cur=null;home()">← Módulos</button><div class="card"><h2>Módulo ${i+1}: ${m.t}</h2><h3>Guía de aprendizaje</h3><ul>${m.g.map(x=>"<li>"+x+"</li>").join("")}</ul>
<button class="s" onclick="openV(${i})">▶ Ver video del módulo</button><button class="s" onclick="openR(${i})">Leer lectura del módulo</button><p class="m" id="st"></p></div><div class="card"><h3>Cuestionario (10 preguntas · aprueba con 8)</h3><div id="qs">`;
Q.forEach((x,k)=>{h+=`<div class="q" id="q${k}"><p>${k+1}. ${x.q}</p>${x.o.map(o=>`<label><input type="radio" name="r${k}" value="${o}">${o}</label>`).join("")}</div>`});
$("app").innerHTML=h+`</div><div id="res"></div><button onclick="grade()">Enviar respuestas</button></div>`;stat();scrollTo(0,0)}
function grade(){const un=Q.filter((x,k)=>!document.querySelector(`input[name=r${k}]:checked`)).length;
if(!S.rd[cur]||!S.vd[cur]){note("Antes de enviar el cuestionario debe abrir la lectura y el video de este módulo (botones de arriba).");return}
if(un){note(`Faltan ${un} pregunta(s) por responder. Conteste todas antes de enviar.`);return}
let n=0;Q.forEach((x,k)=>{const v=document.querySelector(`input[name=r${k}]:checked`),e=$("q"+k),ok=v&&v.value==x.c;if(ok)n++;e.className="q "+(ok?"good":"bad")});
const i=cur,p=n>=PASS;if(S.sc[i]==null||n>S.sc[i]){S.sc[i]=n}if(p&&S.sc[i]<PASS)S.sc[i]=n;save();
$("res").innerHTML=`<p><b>Resultado: ${n*10}%</b> — ${p?"¡Aprobado! Puedes avanzar.":"Necesitas 80% para avanzar. Repasa la guía y la lectura e inténtalo de nuevo."}</p>${p?`<button onclick="home()">Continuar</button>`:`<button onclick="mod(${i})">Reintentar</button>`}`}

d.text("CUIDADO DE LO PÚBLICO DEL COLEGIO",148.5,124,{align:"center"});d.setFont("helvetica","normal");d.setFontSize(12);d.setTextColor(60);
const nota=Math.round(S.sc.reduce((a,b)=>a+b,0)*2);d.text(`5 módulos · Promedio ${nota}%`,148.5,138,{align:"center"});

d.line(105,178,192,178);d.text("Coordinación Académica",148.5,185,{align:"center"});
const fn="Certificado-"+S.doc+".pdf";
try{const dl=await claude.use("downloads");if(dl){await dl.save({filename:fn,data:d.output("blob")});fin();return}}catch(e){}

const V=["dV3Cu69f03g","ZjZHxOEv1p8","_KjUhXXE0t4","C7xXo-Q5Uk0","7DDSsrMhyoI"];
const R=[["Reconoce que tu aula, tu cancha y tus libros pertenecen a todos. Antes de usar algo pregúntate: ¿quedará bien para el compañero que viene después? Si ves un daño, repórtalo a tu director de grupo: no es chisme, es cuidado. Reto de la semana: deja siempre tu puesto limpio y ordenado.","Usted es el principal modelo de conducta: sus hábitos se replican en el grupo. Inicie la clase recordando una norma de cuidado, lleve un registro de novedades del aula y reporte a coordinación a tiempo. Reconozca públicamente a los grupos que cuidan sus espacios."],

["Respeta los turnos en la cancha, haz fila en la cafetería y recoge lo que uses. Mantén los pasillos libres y resuelve los desacuerdos hablando. Si alguien daña un bien, avisa a un adulto responsable: no lo imites ni lo celebres.","Acompañe los descansos y cambios de clase, dé indicaciones claras sobre el uso de cada espacio y medie los conflictos con diálogo según el manual de convivencia. Reporte los incidentes con hechos concretos, sin juicios."],
["Conoce tus deberes y derechos en el manual de convivencia. Si causas un daño, asúmelo y repáralo junto con tu acudiente y el colegio. Únete a brigadas, comités y campañas de cuidado: ser ciudadano responsable empieza en el colegio.","Aplique el debido proceso del manual de convivencia con enfoque formativo: priorice la reparación del daño sobre el castigo. Impulse brigadas y proyectos de cuidado y evalúe con los estudiantes los avances del grupo."]];

function lg(){$("lg").innerHTML=SH?`<img src="${SH}" alt="Escudo INEM" style="height:46px;border-radius:50%">`:`<span class="ph">Falta escudo</span>`}
function shieldBox(){return""}
function stat(){const e=$("st");if(e&&cur!==null)e.textContent=`Lectura: ${S.rd[cur]?"leída":"pendiente"} · Video: ${S.vd[cur]?"visto":"pendiente"} (obligatorios para enviar el cuestionario)`}
function openR(i){const m=M[i],k0=S.role=="Docente"?1:0,L=["Guía para estudiantes","Guía para docentes"];
$("rc").innerHTML=`<h2>Lectura · Módulo ${i+1}</h2><p class="m">${m.t}</p>`+[k0,1-k0].map((k,j)=>`<div class="card" style="${j?"":"border-color:var(--p)"}"><h3>${L[k]}${j?"":" (tu rol)"}</h3><p>${R[i][k]}</p></div>`).join("")+`<button onclick="closeM()">Cerrar y volver al módulo</button>`;$("rd").classList.add("on");S.rd[i]=1;save();stat()}
function openV(i){$("rc").innerHTML=`<h2>Video · Módulo ${i+1}</h2><div class="vw"><iframe src="https://www.youtube-nocookie.com/embed/${V[i]}?rel=0&modestbranding=1" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="Video del módulo ${i+1}"></iframe></div><p class="m">Nota: si el video no carga, el navegador o la red está bloqueando YouTube; la página no lo redirige a otro sitio.</p><button onclick="closeM()">Cerrar video y volver al módulo</button>`;$("rd").classList.add("on");S.vd[i]=1;save();stat()}
function closeM(){$("rd").classList.remove("on");$("rc").innerHTML="";cur===null?home():stat()}
function fin(){S.printed=1;save();home();note("Certificado generado. Verifique que el PDF se guardó en su dispositivo.","ok")}
